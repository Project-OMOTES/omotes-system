services:
 caddy:
    image: ghcr.io/project-omotes/caddy-with-geoip:2.11.7
    restart: unless-stopped
    environment:
      - PROTOCOL=${PROTOCOL}
      - MAPEDITOR_DOMAIN=${MAPEDITOR_DOMAIN}
      - DRIVE_DOMAIN=${DRIVE_DOMAIN}
      - KEYCLOAK_DOMAIN=${KEYCLOAK_DOMAIN}
      - GEOSERVER_DOMAIN=${GEOSERVER_DOMAIN}
      - PREFECT_DOMAIN=${PREFECT_DOMAIN}
      - SEAWEEDFS_DOMAIN=${SEAWEEDFS_DOMAIN}
      - SEAWEEDFS_API_DOMAIN=${SEAWEEDFS_API_DOMAIN}
      - METRICS_DOMAIN=${METRICS_DOMAIN}
      - GRAFANA_DOMAIN=${GRAFANA_DOMAIN}
      - NEW_USER_EMAIL=${NEW_USER_EMAIL}
      - ALLOW_COUNTRIES=${ALLOW_COUNTRIES}
      - WHITELIST_IP=${WHITELIST_IP}
      - WHITELIST_IP_ADMIN=${WHITELIST_IP_ADMIN}
    ports:
      - "80:80"
      - "443:443"
    networks:
      mapeditor-net:
        aliases:
          - ${GRAFANA_DOMAIN}
          - ${KEYCLOAK_DOMAIN}
          - ${MAPEDITOR_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/GeoLite2-Country.mmdb:/geo-db/GeoLite2-Country.mmdb
    depends_on:
      - keycloak
      - grafana