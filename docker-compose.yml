networks:
  omotes:
    driver: bridge
    name: omotes

volumes:
  seaweedfs_data:
  postgres_data:
  influxdb_data:
  victoria_metrics_data:

x-orchestrator-environment: &orchestrator-environment
  LOG_LEVEL: INFO
  PREFECT_API_URL: http://omotes-prefect-server:4200/api
  PREFECT_API_AUTH_STRING: "${PREFECT_USER_NAME}:${PREFECT_PASSWORD}"
  S3_HOST: omotes-seaweedfs
  S3_PORT: 8333
  S3_FILER_PORT: ${S3_FILER_PORT:-8888}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  INFLUX_HOST: omotes_influxdb
  INFLUX_PORT: ${INFLUXDB_PORT}
  INFLUX_USERNAME: ${INFLUXDB_ADMIN_USER}
  INFLUX_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
  POSTGRES_HOST: omotes_postgres
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_USERNAME: ${POSTGRES_TIMESERIES_RW_USER_NAME}
  POSTGRES_PASSWORD: ${POSTGRES_TIMESERIES_RW_USER_PASSWORD}
  ORCHESTRATOR_DATABASE_HOST: omotes_postgres
  ORCHESTRATOR_DATABASE_PORT: ${POSTGRES_PORT}
  ORCHESTRATOR_DATABASE_NAME: omotes_orchestrator
  ORCHESTRATOR_DATABASE_USERNAME: ${POSTGRES_ORCHESTRATOR_USER_NAME}
  ORCHESTRATOR_DATABASE_PASSWORD: ${POSTGRES_ORCHESTRATOR_USER_PASSWORD}
  WORKFLOW_SETTINGS_FILE: /app/config/workflow_config.json

services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.153.0
    profiles:
      - monitoring
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${VMUI_USERNAME:?Set VMUI_USERNAME in .env before starting monitoring}"
        : "$${VMUI_PASSWORD:?Set VMUI_PASSWORD in .env before starting monitoring}"
        exec /victoria-metrics-prod \
          -storageDataPath=/victoria-metrics-data \
          -retentionPeriod=1w \
          -selfScrapeInterval=10s \
          -promscrape.config=/etc/victoria-metrics/promscrape.yml \
          -vmui.customDashboardsPath=/etc/victoria-metrics/dashboards \
          -vmui.defaultTimezone=Europe/Amsterdam \
          -httpAuth.username="$${VMUI_USERNAME}" \
          -httpAuth.password="$${VMUI_PASSWORD}"
    environment:
      VMUI_USERNAME: ${VMUI_USERNAME:-}
      VMUI_PASSWORD: ${VMUI_PASSWORD:-}
    ports:
      - "8428:8428"
    networks:
      - omotes
    volumes:
      - victoria_metrics_data:/victoria-metrics-data
      - ./monitoring/victoria-metrics-scrape.yml:/etc/victoria-metrics/promscrape.yml:ro
      - ./monitoring/vmui-dashboards:/etc/victoria-metrics/dashboards:ro

  telegraf-docker-metrics:
    image: telegraf:1.40.1-alpine
    profiles:
      - monitoring
    user: "1000:${DOCKER_SOCKET_GID:-1001}"
    networks:
      - omotes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/hostfs:ro
      - ./monitoring/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  omotes_influxdb:
    image: influxdb:1.7
    ports:
      - "${INFLUXDB_PORT}:${INFLUXDB_PORT}"
      - "${INFLUXDB_RPC_PORT}:${INFLUXDB_RPC_PORT}"
    networks:
      - omotes
    environment:
      INFLUXDB_PORT: ${INFLUXDB_PORT}
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      INFLUXDB_WRITE_USER: ${INFLUXDB_WRITE_USER}
      INFLUXDB_WRITE_USER_PASSWORD: ${INFLUXDB_WRITE_USER_PASSWORD}
      INFLUXDB_FRONTEND_ADMIN_USER: ${INFLUXDB_FRONTEND_ADMIN_USER}
      INFLUXDB_FRONTEND_ADMIN_USER_PASSWORD: ${INFLUXDB_FRONTEND_ADMIN_USER_PASSWORD}
      INFLUXDB_HTTP_BIND_ADDRESS: :${INFLUXDB_PORT}
      INFLUXDB_BIND_ADDRESS: :${INFLUXDB_RPC_PORT}
      INFLUXDB_DB: omotes_timeseries
      INFLUXDB_HTTP_AUTH_ENABLED: true
      LOG_LEVEL: ${LOG_LEVEL}
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:${INFLUXDB_PORT}/ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - ./influxdb/influxdb-init.sh:/docker-entrypoint-initdb.d/influxdb-init.sh:ro
      - ./influxdb/influxdb.conf:/etc/influxdb/influxdb.conf:ro
      - influxdb_data:/var/lib/influxdb

  omotes_postgres:
    image: postgres:15.4
    restart: unless-stopped
    command: ["postgres", "-p", "${POSTGRES_PORT}"]
    volumes:
      - ./postgres/postgres-init.sql:/setup/init.sql:ro
      - ./postgres/postgres-init.sh:/docker-entrypoint-initdb.d/01-postgres-init.sh:ro
      - postgres_data:/var/lib/postgresql/data/
    expose:
      - "${POSTGRES_PORT}"
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    networks:
      - omotes
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      TIMESERIES_RW_USER_NAME: ${POSTGRES_TIMESERIES_RW_USER_NAME}
      TIMESERIES_RW_USER_PASSWORD: ${POSTGRES_TIMESERIES_RW_USER_PASSWORD}
      TIMESERIES_RO_USER_NAME: ${POSTGRES_TIMESERIES_RO_USER_NAME}
      TIMESERIES_RO_USER_PASSWORD: ${POSTGRES_TIMESERIES_RO_USER_PASSWORD}
      PREFECT_USER_NAME: ${POSTGRES_PREFECT_USER_NAME}
      PREFECT_USER_PASSWORD: ${POSTGRES_PREFECT_USER_PASSWORD}
      ORCHESTRATOR_USER_NAME: ${POSTGRES_ORCHESTRATOR_USER_NAME}
      ORCHESTRATOR_USER_PASSWORD: ${POSTGRES_ORCHESTRATOR_USER_PASSWORD}

      LOG_LEVEL: ${LOG_LEVEL}
    healthcheck:
      test:
        [ "CMD", "pg_isready", "-U", "${POSTGRES_ROOT_USER}", "-p", "${POSTGRES_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 30

  omotes-seaweedfs:
    image: chrislusf/seaweedfs:4.48
    ports:
      - "${SEAWEEDFS_S3_PORT}:8333"   # S3 API
      - "${SEAWEEDFS_ADMIN_PORT}:23646" # Admin UI
    volumes:
      - seaweedfs_data:/data
    networks:
      - omotes
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: prefect-results
    command:
      - mini
      - -dir=/data
      - -admin.user=${SEAWEEDFS_ADMIN_USER:-admin}
      - -admin.password=${SEAWEEDFS_ADMIN_PASSWORD:?Set SEAWEEDFS_ADMIN_PASSWORD}
      - -s3.externalUrl=${S3_EXTERNAL_URL:?Set S3_EXTERNAL_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30

  omotes-prefect-server:
    image: omotes-prefect:3.9.0-ca-fixed
    build:
      context: .
      dockerfile: prefect/Dockerfile
    command: prefect server start
    networks:
      - omotes
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_PREFECT_USER_NAME}:${POSTGRES_PREFECT_USER_PASSWORD}@omotes_postgres:${POSTGRES_PORT}/prefect_server
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: "/api"
      PREFECT_SERVER_API_AUTH_STRING: "${PREFECT_USER_NAME}:${PREFECT_PASSWORD}"
    depends_on:
      omotes_postgres:
        condition: service_healthy
      omotes-seaweedfs:
        condition: service_healthy
    ports:
      - "4200:4200"
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD", "python", "-c",
        "import requests; r = requests.get('http://localhost:4200/api/health'); exit(0 if r.ok else 1)"
      ]
      interval: 10s
      timeout: 5s
      retries: 30

  omotes-prefect-worker:
    image: omotes-prefect:3.9.0-ca-fixed
    build:
      context: .
      dockerfile: prefect/Dockerfile
    command: >
      sh -c 'prefect worker start --pool docker-worker --type docker'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - omotes
    environment:
      PREFECT_API_URL: http://omotes-prefect-server:4200/api
      PREFECT_LOGGING_SERVER_LEVEL: WARNING
      PREFECT_API_AUTH_STRING: "${PREFECT_USER_NAME}:${PREFECT_PASSWORD}"
    depends_on:
      omotes-prefect-server:
        condition: service_healthy
    restart: unless-stopped

  omotes-orchestrator-migrate:
    image: ghcr.io/project-omotes/omotes_orchestrator:2.2.0
    command: ["alembic", "upgrade", "head"]
    environment: *orchestrator-environment
    networks:
      - omotes
    depends_on:
      omotes_postgres:
        condition: service_healthy
    restart: "no"

  omotes-orchestrator:
    image: ghcr.io/project-omotes/omotes_orchestrator:2.2.0
    environment: *orchestrator-environment
    volumes:
      - ${WORKFLOW_SETTINGS_FILE:?}:/app/config/workflow_config.json
    networks:
      - omotes
    depends_on:
      omotes-orchestrator-migrate:
        condition: service_completed_successfully
      omotes-seaweedfs:
        condition: service_healthy
    ports:
      - "9200:9200"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/health', timeout=5).read()"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  omotes-deploy-optimizer:
    image: ghcr.io/project-omotes/omotes-optimizer:${OPTIMIZER_WORKER_VERSION}
    profiles:
    - deploy-optimizer
    environment:
      LOG_LEVEL: INFO
      PREFECT_API_URL: http://omotes-prefect-server:4200/api
      PREFECT_API_AUTH_STRING: "${PREFECT_USER_NAME}:${PREFECT_PASSWORD}"
      ORCHESTRATOR_API_URL: http://omotes-orchestrator:9200
      PREFECT_API_URL_FOR_WORKER: http://omotes-prefect-server:4200/api
      PREFECT_WORK_POOL_NAME: "docker-worker"
      OPTIMIZER_WORKER_VERSION: ${OPTIMIZER_WORKER_VERSION}
      ESDL_OUTPUT_PROFILES_TYPE: ${OPTIMIZER_ESDL_OUTPUT_PROFILES_TYPE}
      PREFECT_FLOW_MAX_CONCURRENT_RUNS: ${OPTIMIZER_FLOW_MAX_CONCURRENT_RUNS}
      PREFECT_GUROBI_MAX_CONCURRENT_RUNS: ${OPTIMIZER_GUROBI_MAX_CONCURRENT_RUNS:-1}
      PREFECT_FLOW_TIMEOUT_SECONDS: ${OPTIMIZER_PREFECT_FLOW_TIMEOUT_SECONDS}
      DB_HOSTNAME: omotes_postgres
      DB_PORT: ${POSTGRES_PORT}
      DB_USERNAME: ${POSTGRES_TIMESERIES_RW_USER_NAME}
      DB_PASSWORD: ${POSTGRES_TIMESERIES_RW_USER_PASSWORD}
      PG_DB_TIMESERIES: omotes_timeseries
      S3_HOST: omotes-seaweedfs
      S3_PORT: 8333
      S3_EXTERNAL_URL: ${S3_EXTERNAL_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      PREFECT_DOCKER_WORKER_NETWORKS: ${PREFECT_DOCKER_WORKER_NETWORKS:-omotes}
    networks:
      - omotes
    depends_on:
      omotes-prefect-server:
        condition: service_healthy
    entrypoint: ["/src/.venv/bin/python", "-m", "omotes_optimizer_worker.prefect_deploy_flow"]
    restart: no

  omotes-deploy-simulator:
    image: ghcr.io/project-omotes/omotes-simulator-worker:${SIMULATOR_WORKER_VERSION}
    profiles:
    - deploy-simulator
    environment:
      LOG_LEVEL: INFO
      PREFECT_API_URL: http://omotes-prefect-server:4200/api
      PREFECT_API_AUTH_STRING: "${PREFECT_USER_NAME}:${PREFECT_PASSWORD}"
      ORCHESTRATOR_API_URL: http://omotes-orchestrator:9200
      PREFECT_API_URL_FOR_WORKER: http://omotes-prefect-server:4200/api
      PREFECT_WORK_POOL_NAME: "docker-worker"
      SIMULATOR_WORKER_VERSION: ${SIMULATOR_WORKER_VERSION}
      PREFECT_FLOW_MAX_CONCURRENT_RUNS: ${SIMULATOR_FLOW_MAX_CONCURRENT_RUNS}
      PREFECT_FLOW_TIMEOUT_SECONDS: ${SIMULATOR_PREFECT_FLOW_TIMEOUT_SECONDS}
      INFLUXDB_HOSTNAME: omotes_influxdb
      INFLUXDB_PORT: ${INFLUXDB_PORT}
      INFLUXDB_USERNAME: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      S3_HOST: omotes-seaweedfs
      S3_PORT: 8333
      S3_EXTERNAL_URL: ${S3_EXTERNAL_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      PREFECT_DOCKER_WORKER_NETWORKS: ${PREFECT_DOCKER_WORKER_NETWORKS:-omotes}
    networks:
      - omotes
    depends_on:
      omotes-prefect-server:
        condition: service_healthy
    entrypoint: ["/src/.venv/bin/python", "-m", "simulator_worker.prefect_deploy_flow"]
    restart: no
