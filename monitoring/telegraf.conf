[agent]
  interval = "5s"
  flush_interval = "5s"

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  source_tag = true
  container_state_include = ["running", "exited"]
  docker_label_include = ["com.docker.compose.project", "com.docker.compose.service", "io.prefect.*"]
  namepass = [
    "docker_container_mem",
    "docker_container_cpu",
    "docker_container_status",
    "docker_container_net",
  ]

[[inputs.mem]]

[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.system]]
  include = ["cpus"]

[[outputs.prometheus_client]]
  listen = ":9273"
  expiration_interval = "30s"