[project]
name = "omotes-system"
version = "1.0.0"
description = "Omotes System"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Mark Vrijlandt", email = "mark.vrijlandt@tno.nl" },
    { name = "Cheng-Kai Wang", email = "cheng-kai.wang@tno.nl" },
    { name = "Sebastiaan la Fleur", email = "sebastiaan.lafleur@tno.nl" },
]
keywords = ["omotes", "orchestrator", "rest", "api", "fastapi", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "omotes-sdk-python==5.0.2",
    "pytest ~= 8.1.2",
    "pytest-timeout",
    "pytest-asyncio ~= 0.23.8",
    "pytest-xdist ~= 3.8.0",
    "xmltodict ~= 0.13.0",
    "pip-tools",
    "deepdiff ~= 7.0",
    "pyesdl ~= 26.7.1",
    "psycopg[binary,pool] ~= 3.2.1",
    "influxdb ~= 5.3",
]

[dependency-groups]
dev = ["ruff>=0.1.0", "ty>=0.0.1a16"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["system_tests/src"]
testpaths = ["system_tests/src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
    "D",   # pydocstyle
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]                                             # assert statements are standard in tests
"src/orchestrator/settings.py" = ["S104"]                         # 0.0.0.0 is intentional for Docker
"system_tests/src/test_workflows_steps.py" = ["ANN", "D", "S101"]
