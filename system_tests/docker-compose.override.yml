services:
  system_tests:
    build:
      context: . # This is referenced from root of repo due to how docker-compose works.
      dockerfile: system_tests/Dockerfile
    networks:
      - omotes
    volumes:
      - ./system_tests_artifacts:/app/test_esdl/artifacts
    depends_on:
      omotes-orchestrator:
        condition: service_healthy
      omotes-deploy-optimizer:
        condition: service_completed_successfully
      omotes_postgres:
        condition: service_healthy
      omotes_influxdb:
        condition: service_healthy
    environment:
      ORCHESTRATOR_HOST: omotes-orchestrator
      ORCHESTRATOR_PORT: 9200
      INFLUXDB_HOST: omotes_influxdb
      INFLUXDB_PORT: 8096
      OPTIMIZER_FLOW_MAX_CONCURRENT_RUNS: ${OPTIMIZER_FLOW_MAX_CONCURRENT_RUNS}

  omotes_influxdb:
    ports: !override
      - "8196:${INFLUXDB_PORT:-8096}" # exposed (non-default port) so tests can be run/debugged from the host

  omotes_postgres:
    ports: !reset []

  omotes-minio:
    ports: !reset []

  omotes-prefect-server:
    ports: !reset []

  omotes-orchestrator:
    ports: !override
      - "9210:9200" # exposed (non-default port) so tests can be run/debugged from the host

  omotes-deploy-optimizer:
    environment:
      # Ephemeral flow-run containers must join the renamed network below, not the
      # literal "omotes" network default (which would belong to a different stack).
      PREFECT_DOCKER_WORKER_NETWORKS: omotes-system-tests

  omotes-deploy-simulator:
    environment:
      # Ephemeral flow-run containers must join the renamed network below, not the
      # literal "omotes" network default (which would belong to a different stack).
      PREFECT_DOCKER_WORKER_NETWORKS: omotes-system-tests

networks:
  # The base compose file pins this network to the fixed name "omotes", which would
  # otherwise be shared with (and collide against) an already-running local dev stack.
  omotes:
    name: omotes-system-tests
